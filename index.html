<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" />
    <title>BuildTrack</title>
    <script>
      // Apply the saved theme before the first paint (see src/appearance.ts).
      try {
        var a = JSON.parse(localStorage.getItem('bt-appearance') || '{}');
        var d = a.mode === 'dark' || (a.mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        // The current theme's CSS and font, cached by src/appearance.ts (themes are data in plugins).
        var b = JSON.parse(localStorage.getItem('bt-theme-boot') || '{}');
        if (b.only) d = b.only === 'dark';
        if (b.css) { var s = document.createElement('style'); s.id = 'bt-theme-boot'; s.textContent = b.css; document.head.appendChild(s); }
        if (b.font) document.documentElement.style.setProperty('--app-font', b.font);
        var r = document.documentElement;
        r.dataset.theme = a.theme || 'buildtrack';
        r.dataset.mode = d ? 'dark' : 'light';
        if (a.accent && a.accent !== 'theme') r.dataset.accent = a.accent;
        if (a.corners === 'sharp' || a.corners === 'round') r.dataset.corners = a.corners;
        if (d) r.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
